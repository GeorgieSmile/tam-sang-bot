        - {dish_id: water, qty: 5, option_ids: []}
      fulfillment: delivery
      address_contains: "อาคารกีฬาลานเมฆ"

- id: sim-020
  persona: "แม่ที่สั่งข้าวคนละระดับความเผ็ดให้ตัวเองกับลูก บอกแยกชัดว่ากล่องไหนของใคร"
  opening: "Gives both kaphrao variants and their quantities. Leaves out fulfillment."
  goal: "ข้าวกะเพราหมูสับ 2 กล่อง กล่องของลูกไม่เผ็ด กล่องของแม่เผ็ดมากเพิ่มไข่ดาวสุก แม่ไปรับเองค่ะ"
  expect:
    card:
      items:
        - {dish_id: kaphrao, qty: 1, option_ids: [minced_pork, spice_none]}
        - {dish_id: kaphrao, qty: 1, option_ids: [minced_pork, fried_egg_cooked, spice_extra]}
      fulfillment: pickup
