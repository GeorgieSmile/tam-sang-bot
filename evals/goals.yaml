  persona: "นักเรียนที่รวบรวมรายการให้เพื่อนหลังซ้อมกีฬา ส่งข้อความแยกตามที่เพื่อนบอก"
  opening: "Orders only pad Thai and says delivery without giving the address. Sends the standalone soft eggs and water in separate later messages before giving the address."
  goal: "ผัดไทยเส้นจันท์ไก่ 3 กล่อง ไข่ข้นแยก 2 ที่ น้ำเปล่า 5 ขวด ส่งที่อาคารกีฬาลานเมฆ ห้องชมรมชั้น 1"
