  persona: "เจ้าของร้านดอกไม้ที่สั่งมื้อเย็นให้คนในร้าน พิมพ์ชื่อเมนูกับจำนวนครบ"
  opening: "Gives both items and asks for delivery. Leaves out the address."
  goal: "ข้าวผัดกุ้ง 4 กล่อง โคล่า 4 กระป๋อง ส่งที่ร้านดอกไม้กลีบฝน เลขที่ 19 ซอยก้านแก้ว"
