    card:
      items:
        - {dish_id: garlic, qty: 3, option_ids: [sliced_pork]}
        - {dish_id: omelette_side, qty: 2, option_ids: []}
      fulfillment: delivery
      address_contains: "ซอยสายน้ำผึ้ง 4"

- id: sim-018
  persona: "พนักงานออฟฟิศที่สั่งข้าวคู่กับเครื่องดื่ม เพิ่งตัดสินใจเรื่องความหวานตอนร้านถาม"
  opening: "Orders the chicken kaphrao and an iced cocoa with normal sweetness. Leaves out fulfillment. When asked, changes only the cocoa to extra sweet and says pickup."
  goal: "ข้าวกะเพราไก่เผ็ดน้อยเพิ่มไข่ข้น 1 กล่อง โกโก้เย็นหวานมาก 1 แก้ว ไปรับที่ร้านค่ะ"
  expect:
    card:
      items:
        - {dish_id: kaphrao, qty: 1, option_ids: [chicken, soft_egg_addon, spice_mild]}
        - {dish_id: cocoa, qty: 1, option_ids: [sweetness_extra]}
      fulfillment: pickup

