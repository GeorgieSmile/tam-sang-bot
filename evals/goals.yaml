    card:
      items:
        - {dish_id: fried_rice, qty: 4, option_ids: [shrimp]}
        - {dish_id: cola, qty: 4, option_ids: []}
      fulfillment: delivery
      address_contains: "ร้านดอกไม้กลีบฝน"

- id: sim-017
  persona: "พ่อที่สั่งข้าวให้ครอบครัวแล้วนึกได้ว่าลูกอยากกินไข่เจียวด้วย"
  opening: "Orders only the garlic rice for delivery and leaves out the address. Adds the standalone omelettes when answering with the address."
  goal: "ข้าวหมูชิ้นกระเทียมพริกไทย 3 กล่อง ไข่เจียวแยก 2 ฟอง ส่งที่บ้านเลขที่ 61 ซอยสายน้ำผึ้ง 4"
