[project]
name = "tam-sang-bot"
version = "0.1.0"
description = "Lightweight LINE AI assistant + kitchen board for a Thai made-to-order food shop"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "openai>=1.70.0",
    "pillow>=13.0.0",
    "pyyaml>=6.0.2",
    "segno>=1.6.6",
    "uvicorn[standard]>=0.34.0",
    "zxing-cpp>=3.2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
pythonpath = ["."]
